<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Preserve full URL so the app can restore route on first load.
      sessionStorage.setItem('redirect', location.href)
      var pathname = location.pathname.replace(/\/[^/]*$/, '/')
      location.replace(location.origin + pathname)
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
